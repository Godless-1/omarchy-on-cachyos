<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-labelledby="t d">
  <title id="t">omarchy-on-cachyos</title>
  <desc id="d">Run the full Omarchy desktop in a window on your existing session. Bootloader untouched. Licensed AGPL-3.0-or-later.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/><stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7"/><stop offset="50%" stop-color="#bb9af7"/><stop offset="100%" stop-color="#f7768e"/>
    </linearGradient>
  </defs>
  <rect width="880" height="240" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="879" height="239" rx="13.5" fill="none" stroke="#3b4261" stroke-width="1"/>
  <rect x="0" y="0" width="880" height="4" rx="2" fill="url(#accent)"/>
  <g font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace">
    <text x="44" y="74" font-size="17" fill="#9aa5ce">~/omarchy-on-cachyos</text>
    <text x="44" y="128" font-size="40" font-weight="bold" fill="#c0caf5">omarchy</text>
    <text x="238" y="128" font-size="40" font-weight="bold" fill="#9aa5ce">on</text>
    <text x="300" y="128" font-size="40" font-weight="bold" fill="#7aa2f7">cachyos</text>
    <text x="44" y="164" font-size="16" fill="#9ece6a">Full Omarchy in a window on your desktop. Bootloader untouched.</text>
    <g font-size="13.5">
      <text x="44" y="203" fill="#9aa5ce">$</text>
      <text x="64" y="203" fill="#c0caf5">./install-omarchy-on-cachyos.sh</text>
      <text x="336" y="203" fill="#ff9e64">--dry-run</text>
    </g>
    <text x="836" y="203" font-size="13.5" fill="#9aa5ce" text-anchor="end">AGPL-3.0-or-later</text>
  </g>
</svg>
